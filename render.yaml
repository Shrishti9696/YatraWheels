services:
  - type: web
    name: yatrawheels-api
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "corepack enable pnpm && pnpm install && pnpm run build"
    startCommand: "node --enable-source-maps dist/index.mjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
